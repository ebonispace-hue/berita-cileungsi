name: Bot Berita Otomatis Cileungsi

on:
  schedule:
    - cron: '0 */2 * * *' # Berjalan otomatis setiap 2 jam sekali
  workflow_dispatch: # Tombol manual untuk tes kapan saja

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        # Menambahkan google-auth-library agar sistem bisa membaca Akun Layanan JSON Anda
        run: npm install @google/genai rss-parser google-auth-library

      - name: Jalankan Bot AI
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: node scripts/bot-berita.js

      - name: Commit dan Push Berita Baru ke GitHub
        run: |
          git config --global user.name "Cileungsi Viral Bot"
          git config --global user.email "bot@cileungsiviral.com"
          git add content/berita/*.md
          git diff-index --quiet HEAD || git commit -m "Auto-post: Berita Cileungsi Terbaru [skip ci]"
          git push
